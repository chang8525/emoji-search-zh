<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>繁中 Emoji 搜尋 — 輸入詞彙找表情符號</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --accent: #4f46e5;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
      "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 48px 20px 24px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  .search-wrap {
    max-width: 560px;
    margin: 28px auto 0;
    padding: 0 20px;
  }
  #search {
    width: 100%;
    font-size: 20px;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus {
    border-color: var(--accent);
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }
  .semantic-status {
    text-align: center;
    color: var(--accent);
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
  }
  .tone-picker {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .tone-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .tone-swatch.active {
    border-color: var(--accent);
  }
  .status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 20px 0 4px;
  }
  #results {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 10px;
  }
  .emoji-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
  }
  .emoji-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .emoji-card:active {
    transform: translateY(0);
  }
  .emoji-glyph {
    font-size: 36px;
    line-height: 1;
  }
  .emoji-kw {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .category-nav {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .category-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .category-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a1a;
    color: white;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🔎 繁體中文 Emoji 搜尋</h1>
  <p class="subtitle">輸入詞彙、情緒或語氣，找到最適合的表情符號 — 點一下即可複製</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="例如：開心、生氣、笑死、拜託..." autofocus autocomplete="off">
  <p class="hint" id="hint">在上面輸入詞彙開始搜尋，或從下方分類瀏覽</p>
  <p class="semantic-status" id="semanticStatus"></p>
  <div style="text-align:center; margin-top: 6px;">
    <button id="enableSemanticBtn" style="background:none; border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:12px; color:var(--muted); cursor:pointer;">
      🧠 啟用 AI 語意搜尋（可理解「悠閒」「奇怪」等未收錄詞彙，首次載入約需 10-60 秒）
    </button>
  </div>
  <div class="tone-picker" id="tonePicker">
    <button class="tone-swatch active" data-tone="" style="background:#FFCC4D" title="預設膚色"></button>
    <button class="tone-swatch" data-tone="🏻" style="background:#F7DECE" title="較淺膚色"></button>
    <button class="tone-swatch" data-tone="🏼" style="background:#F3D2A2" title="淺膚色"></button>
    <button class="tone-swatch" data-tone="🏽" style="background:#D5A57A" title="中等膚色"></button>
    <button class="tone-swatch" data-tone="🏾" style="background:#A56E4C" title="中等深膚色"></button>
    <button class="tone-swatch" data-tone="🏿" style="background:#5C4033" title="較深膚色"></button>
  </div>
</div>

<div class="category-nav" id="categoryNav"></div>
<p class="status" id="status"></p>
<div id="results"></div>

<div id="toast">已複製！</div>

<footer>資料來源：手動整理之常用語氣詞彙 + Unicode CLDR 官方註解</footer>

<script>
let DATA = [];
let currentCategory = null;

async function loadData() {
  const res = await fetch('data/emoji_zh.json');
  DATA = await res.json();
  buildCategoryNav();
  renderCategoryBrowse();
}

function buildCategoryNav() {
  const categories = [...new Set(DATA.map(e => e.category))].sort();
  const nav = document.getElementById('categoryNav');
  nav.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = currentCategory === cat ? null : cat;
      document.getElementById('search').value = '';
      updateActiveCategoryBtn();
      renderCategoryBrowse();
    };
    nav.appendChild(btn);
  });
}

function updateActiveCategoryBtn() {
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === currentCategory);
  });
}

// Common filler / intensifier words that don't carry search meaning on
// their own ("好累" and "累" should match the same emoji). We try scoring
// against both the raw query AND this filler-stripped version, and keep
// whichever scores higher — so "好累", "真的累", and "累死" all reach "累".
const STOPWORDS = ["真的", "有點", "有点", "好像", "一下", "超級", "非常",
  "好", "很", "太", "真", "了", "啊", "呢", "喔", "欸", "滿", "挺", "超", "死", "到", "爆"];

function stripFillers(text) {
  let result = text;
  const sorted = [...STOPWORDS].sort((a, b) => b.length - a.length);
  for (const w of sorted) result = result.split(w).join("");
  return result.trim();
}

function tokenizeBigrams(text) {
  text = text.trim();
  if (text.length <= 1) return text ? new Set([text]) : new Set();
  const grams = new Set();
  for (let i = 0; i < text.length - 1; i++) grams.add(text.slice(i, i + 2));
  return grams;
}

function scoreAgainstKeyword(query, kw) {
  if (!query) return 0;
  if (query === kw) return 100;

  if (kw.length >= 1 && query.includes(kw)) {
    // The query (which may be a full sentence) contains this keyword
    // somewhere in it. Score by the keyword's own length/specificity,
    // not by how long the surrounding sentence is — this is what lets
    // full-sentence queries work.
    if (kw.length === 1) {
      // Single-char keywords are noisy unless they're the whole query
      // (handled above) or aren't themselves a filler word — matching
      // "好" (a real keyword for 👍) inside "好累" is a false positive.
      if (STOPWORDS.includes(kw)) return 0;
      return 40;
    }
    return Math.min(90, 40 + kw.length * 10);
  }

  if (query.length >= 2 && kw.length > query.length && kw.includes(query)) {
    // user typed a fragment of a longer keyword
    return 55 * (query.length / kw.length);
  }

  return 0;
}

function scoreEntry(query, keywords) {
  query = (query || "").trim();
  if (!query) return { score: 0, matched: null };

  const stripped = stripFillers(query);
  const variants = stripped && stripped !== query ? [query, stripped] : [query];

  let best = 0, bestKw = null;
  for (const kw of keywords) {
    for (const q of variants) {
      const s = scoreAgainstKeyword(q, kw);
      if (s > best) { best = s; bestKw = kw; }
    }
  }

  if (best === 0) {
    // fallback: bigram overlap, catches loosely related / reordered phrasing
    const qTokens = tokenizeBigrams(query);
    for (const kw of keywords) {
      const kwTokens = tokenizeBigrams(kw);
      let overlap = 0;
      qTokens.forEach(t => { if (kwTokens.has(t)) overlap++; });
      if (overlap > 0) {
        const ratio = overlap / Math.max(1, Math.min(qTokens.size, kwTokens.size));
        const s = 15 + 15 * ratio;
        if (s > best) { best = s; bestKw = kw; }
      }
    }
  }
  return { score: best, matched: bestKw };
}

// Hand-curated loose associations for cases the keyword data won't capture
// on its own — e.g. "龍" (dragon) doesn't literally appear in any dinosaur
// emoji's name, but it's a reasonable visual/conceptual leap for a search
// to make. Extend this list over time as you notice more of these gaps.
const ASSOCIATIONS = {
  "龍": ["🦕", "🦖"],
  "恐龍": ["🦕", "🦖"],
};

// ---------------------------------------------------------------------------
// Skin tone selection
// ---------------------------------------------------------------------------
// Common emoji that support Fitzpatrick skin-tone modifiers. Not exhaustive
// (Unicode defines 100+ of these) — covers hand gestures and common person
// emoji. Easy to extend: just add more base glyphs to this set.
const SKIN_TONE_BASES = new Set([
  '👍','👎','👌','✌','🤞','🤟','🤙','👋','🙌','👏','🙏','💪','✍','🖕','🤲',
  '🙇','🙆','🙅','🙋','🤷','🤦','💁','🙎','🧏','☝','👆','👇','👈','👉','👊','✊',
  '🤛','🤜','👐','🤝','🏃','💃','🕺','🧎','🧍','👶','🧒','👦','👧','🧑','👨','👩',
  '🧓','👴','👵','🤰','🤱','👼','🎅','🤶','🦸','🦹','🧙','🧚','🧛','🧜','🧝','🧞',
  '🧟','💆','💇','🚶','🧗','🏋','🤸','⛹','🏄','🏊','🤽','🚣','🏇','🚴','🚵','🤾',
  '🤹','🧘','🛀','🛌','👤','🫱','🫲','🫳','🫴','🫰'
]);

let selectedTone = '';

function applySkinTone(emoji) {
  if (!selectedTone) return emoji;
  const base = emoji.replace(/\uFE0F$/, ''); // modifiers replace the variation selector
  return SKIN_TONE_BASES.has(base) ? base + selectedTone : emoji;
}

// ---------------------------------------------------------------------------
// Filtering out symbol/letter-tile emoji from results
// ---------------------------------------------------------------------------
// CLDR's full emoji set includes things like 🅰️ 🆎 keycaps, regional letters,
// etc. — technically emoji, but never what someone means when they search a
// mood or object word. If every keyword on an entry is a short ASCII
// letter/number code, it's almost certainly one of these — exclude it from
// results entirely (both keyword and semantic search).
function isSymbolTile(entry) {
  return entry.keywords.length > 0 && entry.keywords.every(kw => /^[A-Za-z0-9]{1,3}$/.test(kw));
}

function applyAssociations(query, results) {
  const dataByEmoji = Object.fromEntries(DATA.map(e => [e.emoji, e]));
  for (const key in ASSOCIATIONS) {
    if (query.includes(key)) {
      for (const emoji of ASSOCIATIONS[key]) {
        const entry = dataByEmoji[emoji];
        if (entry && !results.find(r => r.emoji === emoji)) {
          results.push({ ...entry, matched: `類似：${key}`, score: 65 });
        }
      }
    }
  }
  return results;
}

function search(query, topN = 60) {
  let results = [];
  for (const entry of DATA) {
    if (isSymbolTile(entry)) continue;
    const { score, matched } = scoreEntry(query, entry.keywords);
    if (score > 0) results.push({ ...entry, matched, score });
  }
  results = applyAssociations(query, results);
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, topN);
}

let lastKeywordResults = [];

function renderResults(results, emptyMsg) {
  const container = document.getElementById('results');
  const status = document.getElementById('status');
  container.innerHTML = '';
  if (results.length === 0) {
    status.textContent = emptyMsg || '找不到符合的 emoji，換個詞試試看？';
    return;
  }
  status.textContent = `找到 ${results.length} 個結果`;
  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'emoji-card';
    const glyph = applySkinTone(r.emoji);
    card.innerHTML = `<div class="emoji-glyph">${glyph}</div><div class="emoji-kw">${r.matched || r.keywords[0] || ''}</div>`;
    card.onclick = () => copyEmoji(glyph);
    container.appendChild(card);
  });
}

function renderCategoryBrowse() {
  document.getElementById('hint').style.display = currentCategory ? 'none' : 'block';
  const pool = (currentCategory ? DATA.filter(e => e.category === currentCategory) : DATA).filter(e => !isSymbolTile(e));
  const status = document.getElementById('status');
  status.textContent = currentCategory ? `${currentCategory}（${pool.length}）` : `全部 ${pool.length} 個表情符號`;
  const container = document.getElementById('results');
  container.innerHTML = '';
  pool.slice(0, 300).forEach(e => {
    const card = document.createElement('div');
    card.className = 'emoji-card';
    const glyph = applySkinTone(e.emoji);
    card.innerHTML = `<div class="emoji-glyph">${glyph}</div><div class="emoji-kw">${e.keywords[0] || ''}</div>`;
    card.onclick = () => copyEmoji(glyph);
    container.appendChild(card);
  });
}

function copyEmoji(emoji) {
  navigator.clipboard.writeText(emoji).then(() => showToast());
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1200);
}

// ---------------------------------------------------------------------------
// Semantic search layer (progressive enhancement)
// ---------------------------------------------------------------------------
// The keyword/filler/association search above is instant but purely
// pattern-based — it only knows a word if it's literally tagged somewhere.
// This layer adds real semantic understanding using a small multilingual
// embedding model (Xenova/multilingual-e5-small) running entirely in the
// browser via transformers.js — no server, no API key.
//
// It's loaded lazily in the background so the page stays usable with
// keyword search immediately; semantic results merge in a moment later
// once the model (and this dataset's embeddings) are ready. Embeddings are
// cached in IndexedDB so only the very first visit is slow.
const SEMANTIC_MODEL_ID = 'Xenova/multilingual-e5-small';
let extractor = null;
let entryVectors = null;      // aligned 1:1 with semanticEntries below
let semanticEntries = null;   // DATA minus symbol-tile emoji (🅰️, keycaps, etc.)
let semanticReady = false;
const semanticStatusEl = document.getElementById('semanticStatus');

function cosineSim(a, b) {
  // e5 embeddings from transformers.js are already L2-normalized, so a
  // plain dot product IS the cosine similarity.
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

function hashDataset(data) {
  // cheap content fingerprint so the embedding cache auto-invalidates if
  // you ever update emoji_zh.json
  let h = data.length;
  for (const e of data) {
    const s = e.emoji + e.keywords.join('');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  }
  return `${data.length}-${h}`;
}

function openEmbedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('emoji-search-zh-cache', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('embeddings');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadCachedEmbeddings(dataHash) {
  try {
    const db = await openEmbedDB();
    return await new Promise((resolve) => {
      const store = db.transaction('embeddings', 'readonly').objectStore('embeddings');
      const req = store.get('vectors');
      req.onsuccess = () => {
        const record = req.result;
        resolve(record && record.hash === dataHash ? record.vectors : null);
      };
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null; // IndexedDB unavailable — not fatal, just recompute each visit
  }
}

async function saveCachedEmbeddings(dataHash, vectors) {
  try {
    const db = await openEmbedDB();
    db.transaction('embeddings', 'readwrite').objectStore('embeddings').put({ hash: dataHash, vectors }, 'vectors');
  } catch (e) { /* non-fatal */ }
}

async function initSemanticSearch() {
  const btn = document.getElementById('enableSemanticBtn');
  if (btn) btn.style.display = 'none';
  try {
    semanticStatusEl.textContent = '🧠 語意搜尋模型載入中（第一次約 10-30 秒，之後會自動快取）...';
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.2.4');
    env.useBrowserCache = true;
    extractor = await pipeline('feature-extraction', SEMANTIC_MODEL_ID);

    semanticEntries = DATA.filter(e => !isSymbolTile(e));
    const dataHash = hashDataset(semanticEntries);
    let vectors = await loadCachedEmbeddings(dataHash);

    if (!vectors) {
      const passages = semanticEntries.map(e => `passage: ${e.keywords.join('、')}`);
      const batchSize = 64;
      vectors = [];
      for (let i = 0; i < passages.length; i += batchSize) {
        const batch = passages.slice(i, i + batchSize);
        const output = await extractor(batch, { pooling: 'mean', normalize: true });
        vectors.push(...output.tolist());
        semanticStatusEl.textContent =
          `🧠 建立語意索引中... ${Math.min(i + batchSize, passages.length)}/${passages.length}`;
      }
      saveCachedEmbeddings(dataHash, vectors);
    }

    entryVectors = vectors;
    semanticReady = true;
    semanticStatusEl.textContent = '✓ 語意搜尋已啟用';
    setTimeout(() => { if (semanticStatusEl.textContent === '✓ 語意搜尋已啟用') semanticStatusEl.textContent = ''; }, 2500);
  } catch (err) {
    console.error('Semantic search failed to load — falling back to keyword search only:', err);
    semanticStatusEl.textContent = '⚠️ 語意搜尋載入失敗，繼續使用一般搜尋';
    semanticReady = false;
    if (btn) btn.style.display = 'inline-block';
  }
}

async function semanticSearch(query, excludeEmojis, topN = 4, minSim = 0.86) {
  if (!semanticReady || !extractor || !entryVectors) return [];
  try {
    const output = await extractor([`query: ${query}`], { pooling: 'mean', normalize: true });
    const qVec = output.tolist()[0];
    return semanticEntries
      .map((entry, i) => ({ entry, sim: cosineSim(qVec, entryVectors[i]) }))
      .filter(r => !excludeEmojis.has(r.entry.emoji) && r.sim >= minSim)
      .sort((a, b) => b.sim - a.sim)
      .slice(0, topN)
      // No visible "AI suggested" label — use the entry's own keyword like
      // every other result, so it reads as one seamless search experience.
      .map(r => ({ ...r.entry, matched: r.entry.keywords[0] || '', score: 50 + r.sim * 40 }));
  } catch (err) {
    console.error('Semantic search error:', err);
    return [];
  }
}

// ---------------------------------------------------------------------------
// Wire everything together
// ---------------------------------------------------------------------------
const searchInput = document.getElementById('search');
let searchVersion = 0;
let semanticDebounceTimer = null;

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  const myVersion = ++searchVersion;
  document.getElementById('hint').style.display = q ? 'none' : 'block';

  clearTimeout(semanticDebounceTimer);

  if (!q) {
    lastKeywordResults = [];
    updateActiveCategoryBtn();
    renderCategoryBrowse();
    return;
  }
  currentCategory = null;
  updateActiveCategoryBtn();

  const keywordResults = search(q);
  lastKeywordResults = keywordResults;
  renderResults(keywordResults);

  // Semantic pass runs a moment after typing stops, and merges in without
  // disturbing the instant keyword results already on screen. Results are
  // blended in with no visual distinction from ordinary matches — using
  // the entry's own top keyword as the label, same as everything else —
  // so the experience feels like one coherent search, not "AI added on top."
  semanticDebounceTimer = setTimeout(async () => {
    const excludeEmojis = new Set(keywordResults.map(r => r.emoji));
    const extra = await semanticSearch(q, excludeEmojis);
    if (myVersion !== searchVersion || extra.length === 0) return; // query changed meanwhile, or nothing new
    const combined = [...keywordResults, ...extra];
    lastKeywordResults = combined;
    renderResults(combined);
  }, 350);
});

document.getElementById('enableSemanticBtn').addEventListener('click', initSemanticSearch);

document.getElementById('tonePicker').addEventListener('click', (e) => {
  const btn = e.target.closest('.tone-swatch');
  if (!btn) return;
  selectedTone = btn.dataset.tone;
  document.querySelectorAll('.tone-swatch').forEach(b => b.classList.toggle('active', b === btn));
  // re-render whatever's currently on screen with the new tone applied,
  // without re-running the search itself
  if (searchInput.value.trim()) {
    renderResults(lastKeywordResults);
  } else {
    renderCategoryBrowse();
  }
});

loadData();
</script>

</body>
</html>
